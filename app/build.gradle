apply plugin: 'com.android.application'
android {
    namespace 'com.microduck.sim'
    compileSdk 34
    ndkVersion '25.1.8937393'
    defaultConfig {
        applicationId 'com.microduck.sim'
        minSdk 28
        targetSdk 34
        versionCode 13
        versionName '0.7-m7'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DFETCHCONTENT_UPDATES_DISCONNECTED=ON'
                targets 'microduck_m1'
            }
        }
    }
    externalNativeBuild {
        cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.30.3' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    packagingOptions { jniLibs { useLegacyPackaging true } }
    buildTypes { debug { debuggable true }; release { minifyEnabled false } }
}
dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
}

// Rebuild the MJCF dependency bundle from the sibling training repository before packaging.
tasks.register('prepareModelAssets', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', file('../scripts/prepare_assets.py').absolutePath
}
tasks.named('preBuild').configure { dependsOn 'prepareModelAssets' }
