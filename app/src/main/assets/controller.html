<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Microduck 控制台</title>
<style>
body{margin:0;background:#edf4f7;color:#17344b;font:16px system-ui,sans-serif}main{max-width:600px;margin:auto;padding:24px}
h1{font-size:26px}section{background:white;padding:18px;border-radius:14px;margin:16px 0;box-shadow:0 3px 18px #17344b12}
input,button{font:inherit;padding:12px;border:1px solid #cbdde5;border-radius:9px;box-sizing:border-box}
button{background:#165d83;color:white;border:0;cursor:pointer;min-height:48px}button:disabled{opacity:.45}
.row{display:flex;gap:10px;margin:12px 0}.row>*{flex:1;min-width:0}.pause{background:#b33838}
label{display:block;margin:12px 0}label input{display:block;width:100%;margin-top:6px}
#status{white-space:pre-wrap;font:14px ui-monospace,monospace;line-height:1.8}.note{font-size:14px;color:#56717f;line-height:1.6}
#message{min-height:24px}#pair input{width:100%}
.camera-box{position:relative;aspect-ratio:360/640;max-width:360px;margin:auto;overflow:hidden;background:#1e3040;border-radius:9px}
#video{position:absolute;top:50%;left:50%;width:177.7778%;height:56.25%;object-fit:contain;transform:translate(-50%,-50%) rotate(90deg)}
#video:not([src]){display:none}
#rtcVideo{width:100%;height:100%;object-fit:contain}#rtcVideo[hidden]{display:none}#videoToggle{width:auto;display:inline;margin-right:8px}
</style>
<main>
<h1>Microduck · 局域网控制</h1>
<p class="note">仿真手机保持应用在前台。外部 3D 可关闭，相机独立运行。实时画面来自机器人的头部摄像头，随头部运动；手机上可独立拖动外部观察视角。</p>
<section id="pair"><label>仿真手机显示的4位访问码<input id="token" type="password" inputmode="numeric" pattern="[0-9]{4}" autocomplete="off" spellcheck="false" maxlength="4"></label>
<button id="connect">连接</button></section>
<section><div id="message" role="status">尚未连接</div><div id="status">等待手机状态…</div></section>
<section><label><input id="videoToggle" type="checkbox">开启机器人摄像头</label>
<label>画面传输<select id="videoMode"><option value="rtc">WebRTC（优先 H.264 硬件编码）</option><option value="jpeg">JPEG（兼容模式）</option></select></label>
<div class="camera-box"><video id="rtcVideo" autoplay muted playsinline hidden></video><img id="video" alt="机器人头部摄像头的仿真画面"></div><p id="videoStatus" class="note" role="status">摄像头未开启</p></section>
<section id="controls">
<div class="row"><button data-op="stand">策略站立</button><button data-op="forward">前进 0.30m/s</button></div>
<button data-op="roulade" style="width:100%">向前翻滚一次</button>
<p class="note">前滚翻策略执行 2 秒仿真时间后切回站立控制；重复点击不延长翻滚。首次启动策略会从 HOME 开始，已运行时保留当前姿态。可随时暂停或切换站立。</p>
<button class="pause" data-op="pause" style="width:100%">暂停仿真</button>
<details><summary style="margin-top:18px">自定义速度</summary>
<p class="note">前进 0.30m/s 已有手机基准；横移、转向与后退尚待验证。速度改变保留当前姿态。</p>
<label>前后速度 vx（−0.30 至 0.30 m/s）<input id="vx" type="number" value="0.30" step="0.05" min="-0.30" max="0.30"></label>
<label>侧向速度 vy（−0.15 至 0.15 m/s）<input id="vy" type="number" value="0" step="0.05" min="-0.15" max="0.15"></label>
<label>转向速度 yaw（−0.50 至 0.50 rad/s）<input id="yaw" type="number" value="0" step="0.05" min="-0.50" max="0.50"></label>
<button data-op="velocity">应用速度</button></details>
<div class="row"><button data-pose="SIT">复位 SIT</button><button data-pose="STAND">复位 STAND</button><button data-pose="INIT">复位 INIT</button></div>
<p class="note">复位会暂停并关闭策略。页面断开超过 3 秒自动暂停；仿真手机上的操作可接管控制。</p>
</section>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
let exchange=Promise.resolve();
let token=new URLSearchParams(location.hash.slice(1)).get('token')||'',connected=false,busy=false,polling=false;
let rtcView=null;
let videoEpoch=0,videoTimer=0,videoCancel=null,activeUrl='',lastSequence='',videoFrames=0,videoAt=performance.now();
if(token) history.replaceState(null,'',location.pathname);
$('token').value=token;
function controls(){document.querySelectorAll('#controls button').forEach(b=>b.disabled=!connected||busy);$('videoToggle').disabled=!connected}
function haltVideo(text='画面已关闭'){
  stopRtc();videoEpoch++;clearTimeout(videoTimer);if(videoCancel)videoCancel.abort();videoCancel=null;
  if(activeUrl)URL.revokeObjectURL(activeUrl);activeUrl='';$('video').removeAttribute('src');$('videoStatus').textContent=text;
}
function startJpeg(){
  haltVideo();if(!connected||document.hidden||!$('videoToggle').checked)return;
  lastSequence='';videoFrames=0;videoAt=performance.now();$('videoStatus').textContent='等待第一帧…';videoLoop(videoEpoch);
}
async function videoLoop(epoch){
  if(epoch!==videoEpoch||!connected||document.hidden||!$('videoToggle').checked)return;
  const started=performance.now(),cancel=new AbortController();videoCancel=cancel;
  const deadline=setTimeout(()=>cancel.abort(),1500);let url='',retry=100;
  try{
    const response=await fetch('/api/frame',{headers:{Authorization:'Bearer '+token},cache:'no-store',signal:cancel.signal});
    if(epoch!==videoEpoch)return;
    if(response.status===401){connected=false;controls();haltVideo('访问码失效，请重新连接');return}
    if(!response.ok){retry=500;throw Error('等待画面；请保持仿真应用在前台')}
    const sequence=response.headers.get('X-Frame-Sequence');
    if(!response.headers.get('Content-Type')?.startsWith('image/jpeg'))throw Error('画面格式错误');
    const blob=await response.blob();
    if(epoch!==videoEpoch)return;
    if(sequence===lastSequence)return;
    url=URL.createObjectURL(blob);const probe=new Image();probe.src=url;await probe.decode();
    if(epoch!==videoEpoch)return;
    $('video').src=url;if(activeUrl)URL.revokeObjectURL(activeUrl);activeUrl=url;url='';lastSequence=sequence;videoFrames++;
    const fps=videoFrames*1000/Math.max(1,performance.now()-videoAt);
    $('videoStatus').textContent=`机器人视角 · 接收 ${fps.toFixed(1)} FPS · 采集帧龄 ${response.headers.get('X-Frame-Age-Ms')||'—'} ms`;
  }catch(e){if(epoch===videoEpoch){$('videoStatus').textContent=e.name==='AbortError'?'画面请求超时，正在重试':e.message;retry=500}}
  finally{
    clearTimeout(deadline);if(url)URL.revokeObjectURL(url);if(videoCancel===cancel)videoCancel=null;
    if(epoch===videoEpoch)videoTimer=setTimeout(()=>videoLoop(epoch),Math.max(0,retry-(performance.now()-started)));
  }
}
function startVideo(){
  if($('videoMode').value==='jpeg')startJpeg();else startRtc();
}
function stopRtc(){
  const view=rtcView;rtcView=null;
  $('rtcVideo').pause();$('rtcVideo').srcObject=null;$('rtcVideo').hidden=true;
  if(!view)return;
  view.cancel.abort();view.pc.close();clearTimeout(view.timeout);
  // Use this session's access code/id; a late close cannot close a replacement viewer.
  fetch('/api/rtc',{method:'POST',headers:{Authorization:'Bearer '+view.key,'Content-Type':'application/json'},
    body:JSON.stringify({op:'close',id:view.id}),keepalive:true}).catch(()=>{});
}
async function rtcRequest(view,body){
  const cancel=new AbortController(),abort=()=>cancel.abort(),timer=setTimeout(abort,2500);
  view.cancel.signal.addEventListener('abort',abort,{once:true});
  try{
    const response=await fetch('/api/rtc',{method:'POST',headers:{Authorization:'Bearer '+view.key,'Content-Type':'application/json'},
      body:JSON.stringify({...body,id:view.id}),cache:'no-store',signal:cancel.signal});
    const data=await response.json();
    if(response.status===401){connected=false;controls();haltVideo('访问码失效，请重新连接');throw Error('访问码失效')}
    if(!response.ok)throw Error(data.error||'视频信令失败');
    return data;
  }finally{clearTimeout(timer);view.cancel.signal.removeEventListener('abort',abort)}
}
function rtcCurrent(view){return rtcView===view&&!view.cancel.signal.aborted}
function rtcFailure(view,error){
  if(rtcCurrent(view))haltVideo('WebRTC未连接：'+error.message+'。可重新开启或选择 JPEG。');
}
function waitIce(view){
  return new Promise((resolve,reject)=>{
    const pc=view.pc;
    if(view.cancel.signal.aborted){reject(Error('视频已关闭'));return}
    if(pc.iceGatheringState==='complete'){resolve();return}
    const done=()=>{if(pc.iceGatheringState==='complete')finish()},abort=()=>finish(Error('视频已关闭'));
    const timer=setTimeout(()=>finish(),4000);
    function finish(error){clearTimeout(timer);pc.removeEventListener('icegatheringstatechange',done);
      view.cancel.signal.removeEventListener('abort',abort);if(error)reject(error);else resolve()}
    pc.addEventListener('icegatheringstatechange',done);view.cancel.signal.addEventListener('abort',abort,{once:true});
  });
}
async function startRtc(){
  haltVideo();if(!connected||document.hidden||!$('videoToggle').checked)return;
  if(typeof RTCPeerConnection==='undefined'){ $('videoStatus').textContent='浏览器不支持 WebRTC，请选择 JPEG';return}
  if(typeof crypto==='undefined'||!crypto.getRandomValues){$('videoStatus').textContent='浏览器不支持视频会话，请选择 JPEG';return}
  const id=Array.from(crypto.getRandomValues(new Uint8Array(16)),v=>v.toString(16).padStart(2,'0')).join('');
  let peer;try{peer=new RTCPeerConnection({iceServers:[]})}catch(error){$('videoStatus').textContent='WebRTC初始化失败，请选择 JPEG';return}
  const view={id,key:token,pc:peer,cancel:new AbortController(),after:0,
    answered:false,started:performance.now(),timeout:0,lastFrames:0,lastStatsAt:0};rtcView=view;
  const pc=view.pc;$('videoStatus').textContent='正在建立 WebRTC 视频…';
  pc.ontrack=event=>{
    if(!rtcCurrent(view))return;
    $('rtcVideo').srcObject=new MediaStream([event.track]);$('rtcVideo').hidden=false;
    $('rtcVideo').play().catch(error=>rtcFailure(view,error));
  };
  pc.onconnectionstatechange=()=>{
    if(!rtcCurrent(view))return;
    if(pc.connectionState==='failed')rtcFailure(view,Error('ICE连接失败，请检查同一局域网是否允许设备互通'));
  };
  try{
    const transceiver=pc.addTransceiver('video',{direction:'recvonly'});
    if(transceiver.setCodecPreferences&&typeof RTCRtpReceiver!=='undefined'){
      const codecs=RTCRtpReceiver.getCapabilities('video')?.codecs;
      if(codecs)transceiver.setCodecPreferences([...codecs].sort((a,b)=>Number(b.mimeType==='video/H264')-Number(a.mimeType==='video/H264')));
    }
    await pc.setLocalDescription(await pc.createOffer());await waitIce(view);
    if(!rtcCurrent(view))return;
    await rtcRequest(view,{op:'open',sdp:pc.localDescription.sdp});
    if(rtcCurrent(view))rtcPoll(view);
  }catch(error){rtcFailure(view,error)}
}
async function rtcPoll(view){
  if(!rtcCurrent(view))return;
  try{
    const data=await rtcRequest(view,{op:'poll',after:view.after});
    if(!rtcCurrent(view))return;
    if(data.error)throw Error(data.error);
    if(data.answer&&!view.answered){await view.pc.setRemoteDescription(data.answer);view.answered=true}
    if(!rtcCurrent(view))return;
    if(view.answered){for(const candidate of data.candidates){if(!rtcCurrent(view))return;await view.pc.addIceCandidate(candidate)}view.after=data.next}
    const stats=await view.pc.getStats();if(!rtcCurrent(view))return;
    let received=0,codec='等待协商';
    stats.forEach(report=>{if(report.type==='inbound-rtp'&&report.kind==='video'){
      received=report.framesDecoded||0;codec=stats.get(report.codecId)?.mimeType||codec;
    }});
    const now=performance.now(),fps=view.lastStatsAt?(received-view.lastFrames)*1000/(now-view.lastStatsAt):0;
    view.lastStatsAt=now;view.lastFrames=received;
    $('videoStatus').textContent=`机器人视角 · WebRTC ${codec} · ${fps.toFixed(1)} FPS · 解码 ${received} 帧 · ${data.state}`;
    if(!received&&now-view.started>12000)throw Error('视频帧等待超时');
    videoTimer=setTimeout(()=>rtcPoll(view),1000);
  }catch(error){rtcFailure(view,error)}
}
$('videoToggle').onchange=startVideo;$('videoMode').onchange=startVideo;
function message(text){$('message').textContent=text}
function request(path,body,keepalive=false){
  const task=exchange.then(()=>fetchRequest(path,body,keepalive));exchange=task.catch(()=>{});return task;
}
async function fetchRequest(path,body,keepalive=false){
  const cancel=new AbortController(),timer=setTimeout(()=>cancel.abort(),2500);
  try {
    const response=await fetch(path,{method:body?'POST':'GET',headers:{'Authorization':'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},
      body:body?JSON.stringify(body):undefined,cache:'no-store',signal:cancel.signal,keepalive});
    const data=await response.json();
    if(!response.ok){if(response.status===401){connected=false;controls();haltVideo('访问码失效，请重新连接')}throw Error(data.error||('请求失败 '+response.status))}
    return data;
  }finally{clearTimeout(timer)}
}
function show(data){
  const n=(x,d=3)=>typeof x==='number'?x.toFixed(d):'—';
  $('status').textContent=`${data.app_stage||'Microduck'} · ${data.running?'运行':'暂停'}\n仿真 ${n(data.sim_time)} s\n位置 x ${n(data.root_x)} / y ${n(data.root_y)} / z ${n(data.root_z)} m\n策略 ${data.policy||'未加载'} / 启用 ${!!data.policy_enabled}\n控制 ${n(data.control_with_visual_ms)} ms / 20ms\n画面 ${n(data.render_fps,1)} FPS\n数值正常 ${data.finite===true} / 接触点 ${data.contacts??'—'}\n远程控制 ${!!data.remote_control_active}`;
  if(data.remote_stop_reason==='heartbeat_timeout') message('心跳超时，手机已暂停；点击站立或前进可重新接管');
}
async function poll(){
  if(!connected||polling||busy||document.hidden)return;
  polling=true;
  try {await request('/api/command',{op:'heartbeat'});message('已连接 · 心跳正常');show(await request('/api/state'))}
  catch(e){message('连接异常：'+e.message+'；超过3秒手机会暂停')}
  finally{polling=false}
}
$('connect').onclick=async()=>{
  haltVideo('正在连接…');connected=false;controls();
  token=$('token').value.trim();
  if(!/^[0-9]{4}$/.test(token)){message('请输入手机显示的4位数字访问码');return}
  try{show(await request('/api/state'));connected=true;controls();message('已连接');startVideo();await poll()}
  catch(e){connected=false;controls();message('连接失败：'+e.message)}
};
document.querySelectorAll('#controls button').forEach(button=>button.onclick=async()=>{
  if(!connected||busy)return;
  let command;
  if(button.dataset.pose) command={op:'reset',pose:button.dataset.pose};
  else if(button.dataset.op==='forward') command={op:'walk',vx:.30,vy:0,yaw:0};
  else if(button.dataset.op==='velocity'){
    const inputs=['vx','vy','yaw'];
    if(inputs.some(id=>!$(id).value.trim()||!$(id).checkValidity())){message('请填写范围内的速度');return}
    command={op:'walk',...Object.fromEntries(inputs.map(id=>[id,Number($(id).value)]))};
  }else command={op:button.dataset.op};
  busy=true;controls();
  try{const reply=await request('/api/command',command);message('已执行 '+reply.op)}
  catch(e){message('命令失败：'+e.message)}finally{busy=false;controls()}
});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){haltVideo('页面在后台，画面已停止');if(connected)request('/api/command',{op:'pause'},true).catch(()=>{})}
  else{startVideo();poll()}
});
controls();setInterval(poll,1000);if(token)$('connect').click();
</script>
</html>
